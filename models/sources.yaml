version: 2

# Testing convention:
#   - full exports (each export replaces the previous one): the business key must be unique.
#   - incremental exports (every export_date is appended): the key repeats across exports,
#     so we test that (key, export_date) is unique, i.e. no duplicated row inside one export.
#     The int_ models then keep the latest version of each key.

sources:
  - name: optimum
    description: "Raw Optimum data loaded from SFTP ZIP files into BigQuery."
    database: "project-b2a3ecb7-3b81-4883-82d"
    schema: raw_optimum

    tables:

      # ---------- full exports ----------

      - name: shops
        description: "Full shops export."
        columns:
          - name: shop_id
            data_tests: [unique, not_null]

      - name: articles_types
        description: "Full articles types export."
        columns:
          - name: article_type_id
            data_tests: [unique, not_null]

      - name: frame_types
        columns:
          - name: frame_type_id
            data_tests: [unique, not_null]

      - name: packages_details_types
        columns:
          - name: package_detail_type_id
            data_tests: [unique, not_null]

      - name: packages_status
        columns:
          - name: package_status_id
            data_tests: [unique, not_null]

      - name: prescriptors
        columns:
          - name: prescriptor_id
            data_tests: [unique, not_null]

      - name: proposals_status
        columns:
          - name: proposal_status_id
            data_tests: [unique, not_null]

      - name: sellers
        columns:
          - name: seller_id
            data_tests: [unique, not_null]

      - name: visits_status
        columns:
          - name: visit_status_id
            data_tests: [unique, not_null]

      # ---------- incremental exports ----------

      - name: articles
        description: "Articles per shop. article_id is the technical key; article_code is not unique per shop."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [article_id, export_date]
        columns:
          - name: article_id
            data_tests: [not_null]
          - name: article_code
            data_tests: [not_null]
          - name: shop_id
            data_tests: [not_null]

      - name: clients
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [client_id, export_date]
        columns:
          - name: client_id
            data_tests: [not_null]

      - name: clients_invoices
        description: "Incremental client invoices export."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [client_invoice_id, export_date]
        columns:
          - name: client_invoice_id
            data_tests: [not_null]

      - name: clients_invoices_details
        description: "Incremental client invoice details export."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [client_invoice_detail_id, export_date]
        columns:
          - name: client_invoice_detail_id
            data_tests: [not_null]
          - name: client_invoice_id
            data_tests: [not_null]

      - name: credit_notes_invoices
        description: "les avoirs"
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [credit_note_invoice_id, export_date]
        columns:
          - name: credit_note_invoice_id
            data_tests: [not_null]

      - name: credit_notes_invoices_details
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [credit_note_invoice_detail_id, export_date]
        columns:
          - name: credit_note_invoice_detail_id
            data_tests: [not_null]
          - name: credit_note_invoice_id
            data_tests: [not_null]
          - name: client_invoice_detail_id
            data_tests: [not_null]

      - name: packages
        description: "Incremental packages export."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [package_id, export_date]
        columns:
          - name: package_id
            data_tests: [not_null]

      - name: package_details
        description: "Incremental packages details export."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [detail_id, export_date]
        columns:
          - name: detail_id
            data_tests: [not_null]

      - name: package_frame_properties
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [package_detail_id, export_date]
        columns:
          - name: package_detail_id
            data_tests: [not_null]

      - name: packages_packages_statuts_types
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [package_id, export_date]
        columns:
          - name: package_id
            data_tests: [not_null]

      - name: proposals
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [proposal_id, export_date]
        columns:
          - name: proposal_id
            data_tests: [not_null]

      - name: sales_offers
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [sale_offer_id, export_date]
        columns:
          - name: sale_offer_id
            data_tests: [not_null]

      - name: visits
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [visit_id, export_date]
        columns:
          - name: visit_id
            data_tests: [not_null]

      - name: visit_prescription_properties
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [visit_id, export_date]
        columns:
          - name: visit_id
            data_tests: [not_null]
