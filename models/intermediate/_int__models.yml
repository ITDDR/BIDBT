version: 2

# Every int_ model must have exactly one row per key: these are the join keys
# of the fact models, so a duplicate here multiplies rows in baseOp.

models:

  # ---------- reference tables ----------

  - name: int_shops
    columns:
      - name: idMagasin
        data_tests: [unique, not_null]

  - name: int_articles_types
    columns:
      - name: article_type_id
        data_tests: [unique, not_null]

  - name: int_frame_types
    columns:
      - name: frame_type_id
        data_tests: [unique, not_null]

  - name: int_packages_details_types
    columns:
      - name: package_detail_type_id
        data_tests: [unique, not_null]

  - name: int_packages_status
    columns:
      - name: package_status_id
        data_tests: [unique, not_null]

  - name: int_prescriptors
    columns:
      - name: prescriptor_id
        data_tests: [unique, not_null]

  - name: int_proposals_status
    columns:
      - name: proposal_status_id
        data_tests: [unique, not_null]

  - name: int_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  # ---------- deduplicated incremental tables (latest version per key) ----------

  - name: int_articles
    description: "Latest article per (idMagasin, article_code), the key used to join package details."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [idMagasin, article_code]
    columns:
      - name: idMagasin
        data_tests: [not_null]
      - name: article_code
        data_tests: [not_null]

  - name: int_clients
    columns:
      - name: idClient
        data_tests: [unique, not_null]

  - name: int_factures
    columns:
      - name: facture_id
        data_tests: [unique, not_null]
      - name: idClient
        data_tests: [not_null]
      - name: idMagasin
        data_tests: [not_null]

  - name: int_factures_details
    columns:
      - name: facture_detail_id
        data_tests: [unique, not_null]
      - name: facture_id
        data_tests: [not_null]

  - name: int_credit_notes_invoices
    columns:
      - name: credit_note_invoice_id
        data_tests: [unique, not_null]
      - name: idClient
        data_tests: [not_null]
      - name: idMagasin
        data_tests: [not_null]

  - name: int_credit_notes_invoices_details
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [credit_note_invoice_id, facture_detail_id]
    columns:
      - name: credit_note_invoice_id
        data_tests: [not_null]
      - name: facture_detail_id
        data_tests: [not_null]

  - name: int_packages
    columns:
      - name: package_id
        data_tests: [unique, not_null]

  - name: int_package_details
    columns:
      - name: package_detail_id
        data_tests: [unique, not_null]

  - name: int_package_frame_properties
    columns:
      - name: package_detail_id
        data_tests: [unique, not_null]

  - name: int_packages_packages_statuts_types
    columns:
      - name: package_id
        data_tests: [unique, not_null]

  - name: int_proposals
    columns:
      - name: proposal_id
        data_tests: [unique, not_null]

  - name: int_sales_offers
    columns:
      - name: sale_offer_id
        data_tests: [unique, not_null]

  - name: int_visits
    columns:
      - name: visit_id
        data_tests: [unique, not_null]

  - name: int_visit_prescription_properties
    columns:
      - name: visit_id
        data_tests: [unique, not_null]

  # ---------- derived models ----------

  - name: int_factures_details_enriched
    description: "One row per client invoice line with all line-level joins. Shared by both *_extended models."
    columns:
      - name: facture_detail_id
        data_tests: [unique, not_null]

  - name: client_premiere_facture
    columns:
      - name: idClient
        data_tests: [unique, not_null]

  - name: int_partenariat
    columns:
      - name: idClient_chefFamille
        data_tests: [unique, not_null]

  - name: int_partenariat_sans_famille
    columns:
      - name: idClient
        data_tests: [unique, not_null]
